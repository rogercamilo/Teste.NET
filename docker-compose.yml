services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Pré-carrega pg_stat_statements (exige restart do servidor) para paridade
    # com produção: o painel de infraestrutura do super-admin lista as queries
    # mais custosas a partir dessa extensão.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
    environment:
      POSTGRES_USER: formativo
      POSTGRES_PASSWORD: formativo_dev
      POSTGRES_DB: formacao_comunitaria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formativo -d formacao_comunitaria"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
