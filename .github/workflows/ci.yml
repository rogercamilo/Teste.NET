name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          # Skip Prisma binary download during install — we generate manually below
          PRISMA_SKIP_POSTINSTALL_GENERATE: "true"

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        # Warnings are reported but do not block the pipeline.
        # Errors would fail the step. Run `npm run lint` locally to see full output.
        run: npm run lint -- --max-warnings 9999

      - name: Test (with coverage thresholds)
        run: npm run test:coverage
