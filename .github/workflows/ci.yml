name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

# Menor privilégio por padrão; o job coverage-diff eleva para pull-requests: write.
permissions:
  contents: read

jobs:
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          # Skip Prisma binary download during install — we generate manually below
          PRISMA_SKIP_POSTINSTALL_GENERATE: "true"

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        # Warnings are reported but do not block the pipeline.
        # Errors would fail the step. Run `npm run lint` locally to see full output.
        run: npm run lint -- --max-warnings 9999

      - name: Test (with coverage thresholds)
        run: npm run test:coverage

  security-audit:
    name: Security audit (report-only)
    # DELIBERADAMENTE NÃO-BLOQUEANTE. Antes o `npm audit --audit-level=high` era um
    # passo do job `ci`: quando uma advisory nova saía numa dependência (mesmo sem
    # relação com a mudança), o job ficava vermelho e o gate "Wait for CI" do Railway
    # estrangulava TODOS os deploys em silêncio — inclusive fixes de infra urgentes
    # (incidente 2026-07-23: warm-up/2-réplicas do login ficou SKIPPED por uma CVE de
    # @auth/core). Aqui o audit RODA e publica o resultado, mas o job sempre conclui
    # verde; o alerta acionável fica por conta do Dependabot (já ativo no repo).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: "true"

      - name: Audit (report to job summary — never fails the pipeline)
        run: |
          echo "## \`npm audit --audit-level=high\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if npm audit --audit-level=high >> "$GITHUB_STEP_SUMMARY" 2>&1; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "✅ Sem vulnerabilidades high/critical." >> "$GITHUB_STEP_SUMMARY"
          else
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ Vulnerabilidades high/critical encontradas — revise acima (não bloqueia o deploy)." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Security audit::npm audit encontrou vulnerabilidades high/critical — ver resumo do job (não bloqueia o deploy)."
          fi

  coverage-diff:
    name: Coverage regression (PR vs base)
    # Só roda em PR: compara a cobertura do head com a da base para pegar erosão
    # gradual que o threshold absoluto do job `ci` não detecta.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: frontend
    env:
      # Reprova se a cobertura de statements cair mais que este Δ (pontos percentuais).
      MAX_COVERAGE_DROP_PP: "1.0"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (PR head)
        run: npm ci
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: "true"

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Coverage — PR head
        run: npm run test:coverage

      - name: Capture head coverage
        id: head
        run: echo "pct=$(node -p "require('./coverage/coverage-summary.json').total.statements.pct")" >> "$GITHUB_OUTPUT"

      - name: Coverage — base branch
        id: base
        # Nunca bloqueia o PR por estado da base (ex.: baseline ainda sem json-summary).
        continue-on-error: true
        run: |
          git worktree add ../base "${{ github.event.pull_request.base.sha }}"
          cd ../base/frontend
          npm ci
          npx prisma generate
          npm run test:coverage
          PCT=$(node -e "try{process.stdout.write(String(require('./coverage/coverage-summary.json').total.statements.pct))}catch(e){process.stdout.write('na')}")
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: "true"

      - name: Compare and comment
        uses: actions/github-script@v7
        with:
          script: |
            const head = Number("${{ steps.head.outputs.pct }}");
            const baseRaw = "${{ steps.base.outputs.pct }}";
            const base = Number(baseRaw);
            const maxDrop = Number(process.env.MAX_COVERAGE_DROP_PP);
            const marker = "<!-- coverage-diff -->";

            let body, regressed = false;
            if (!baseRaw || baseRaw === "na" || Number.isNaN(base)) {
              body = `### ⚪ Cobertura (statements)\n\nBaseline da base indisponível — gate de regressão pulado. PR em **${head.toFixed(2)}%**.`;
            } else {
              const drop = +(base - head).toFixed(2);
              regressed = drop > maxDrop;
              const emoji = regressed ? "🔴" : (drop > 0 ? "🟡" : "🟢");
              const sign = drop > 0 ? "-" : "+";
              body = [
                `### ${emoji} Cobertura (statements)`,
                ``,
                `| Base | PR | Δ |`,
                `|---|---|---|`,
                `| ${base.toFixed(2)}% | ${head.toFixed(2)}% | ${sign}${Math.abs(drop).toFixed(2)} pp |`,
                ``,
                regressed
                  ? `Queda de **${drop.toFixed(2)} pp** excede o limite de ${maxDrop.toFixed(2)} pp. Adicione testes ou justifique a regressão.`
                  : `Sem regressão relevante (limite ${maxDrop.toFixed(2)} pp).`,
              ].join("\n");
            }

            const fullBody = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: fullBody });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: fullBody });
            }
            if (regressed) core.setFailed(`Cobertura caiu ${(base - head).toFixed(2)} pp (> ${maxDrop} pp).`);

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: formativo
          POSTGRES_PASSWORD: formativo_dev
          POSTGRES_DB: formacao_comunitaria
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://formativo:formativo_dev@localhost:5432/formacao_comunitaria
      # Secret fixo apenas para o ambiente efêmero de CI (não é segredo real).
      AUTH_SECRET: e2e_ci_secret_0123456789abcdef0123456789abcdef
      NEXTAUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: "true"

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
