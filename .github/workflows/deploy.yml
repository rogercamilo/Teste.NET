name: Deploy to Railway

on:
  # Triggers only after the CI workflow completes successfully on master/main
  workflow_run:
    workflows: ["CI"]
    branches: [master, main]
    types: [completed]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Only run if the CI workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        # RAILWAY_TOKEN must be set in GitHub repository secrets.
        # To get it: Railway dashboard → Account Settings → Tokens → Create Token
        # Then: GitHub repo → Settings → Secrets → New repository secret → RAILWAY_TOKEN
        run: railway up --service ${{ vars.RAILWAY_SERVICE_NAME || 'app' }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
